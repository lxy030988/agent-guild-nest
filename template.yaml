# ============================================
# AWS SAM 模板 - NestJS Lambda 部署配置
# ============================================
# 本模板定义了完整的 VPC 网络架构，包括：
# - 1个VPC (10.0.0.0/16)
# - 1个公网子网 (部署NAT Gateway)
# - 3个私网子网 (部署Lambda和RDS)
# - NAT Gateway (提供私网访问互联网)
# - Internet Gateway (VPC与互联网的桥梁)
# ============================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NestJS Application with VPC Configuration

# ============================================
# 参数定义
# ============================================
# 部署时可以动态传入的参数
Parameters:
  # 环境名称（开发/预生产/生产）
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name

  # 可用区列表（手动指定以避免 GetAZs 问题）
  AvailabilityZones:
    Type: CommaDelimitedList
    Description: List of Availability Zones to use (e.g. us-east-1a,us-east-1b,us-east-1c)
    Default: us-east-1a,us-east-1b,us-east-1c

  # 数据库密码（部署时需要输入）
  DBPassword:
    Type: String
    Description: Password for the RDS database
    NoEcho: true
    MinLength: 8

# ============================================
# 全局配置
# ============================================
# 所有Lambda函数的默认配置
Globals:
  Function:
    Timeout: 30 # Lambda超时时间（秒）
    MemorySize: 1024 # Lambda内存大小（MB）
    Runtime: nodejs24.x # Node.js运行时版本
    Environment:
      Variables:
        NODE_ENV: !Ref Environment # 环境变量

# ============================================
# 资源定义
# ============================================
Resources:
  # ==========================================
  # VPC (虚拟私有云)
  # ==========================================
  # 创建一个隔离的虚拟网络空间
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16 # IP地址范围：10.0.0.0 - 10.0.255.255 (65,536个IP)
      EnableDnsHostnames: true # 启用DNS主机名（RDS需要）
      EnableDnsSupport: true # 启用DNS解析
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  # ==========================================
  # Internet Gateway (互联网网关)
  # ==========================================
  # VPC与互联网之间的桥梁，允许VPC内资源访问互联网
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  # 将Internet Gateway附加到VPC
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ==========================================
  # 公网子网 (Public Subnet)
  # ==========================================
  # 用途：部署NAT Gateway
  # 特点：有公网IP，可以直接访问互联网
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24 # IP范围：10.0.1.0 - 10.0.1.255 (256个IP)
      # 使用参数中的第一个可用区
      AvailabilityZone: !Select [0, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: true # 自动分配公网IP
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-subnet-1

  # 公网子网路由表
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-rt

  # 公网子网路由规则
  # 将所有外网流量(0.0.0.0/0)路由到Internet Gateway
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0 # 所有外网地址
      GatewayId: !Ref InternetGateway # 下一跳：Internet Gateway

  # 将路由表关联到公网子网
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ==========================================
  # NAT Gateway (网络地址转换网关)
  # ==========================================
  # 用途：让私网子网的资源访问互联网
  # 工作原理：将私有IP转换为公网IP

  # NAT Gateway需要的弹性公网IP
  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc # 用于VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat-eip

  # NAT Gateway（部署在公网子网）
  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId # 绑定弹性IP
      SubnetId: !Ref PublicSubnet # 必须部署在公网子网
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat

  # ==========================================
  # 私有子网 (Private Subnets)
  # ==========================================
  # 用途：部署Lambda和RDS
  # 特点：无公网IP，通过NAT Gateway访问互联网
  # 创建3个私有子网以实现高可用（分布在3个可用区）

  # 私有子网1 (可用区A)
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24 # IP范围：10.0.11.0 - 10.0.11.255
      # 使用参数中的第一个可用区
      AvailabilityZone: !Select [0, !Ref AvailabilityZones]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-subnet-1

  # 私有子网2 (可用区B)
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24 # IP范围：10.0.12.0 - 10.0.12.255
      # 使用参数中的第二个可用区
      AvailabilityZone: !Select [1, !Ref AvailabilityZones]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-subnet-2

  # 私有子网3 (可用区C)
  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.13.0/24 # IP范围：10.0.13.0 - 10.0.13.255
      # 使用参数中的第三个可用区
      AvailabilityZone: !Select [2, !Ref AvailabilityZones]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-subnet-3

  # 私有子网路由表（3个私有子网共用一个路由表）
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-rt

  # 私有子网路由规则
  # 将所有外网流量(0.0.0.0/0)路由到NAT Gateway
  # 这样私网资源就能通过NAT访问互联网了
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0 # 所有外网地址
      NatGatewayId: !Ref NATGateway # 下一跳：NAT Gateway

  # 将路由表关联到私有子网1
  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  # 将路由表关联到私有子网2
  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # 将路由表关联到私有子网3
  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

  # ==========================================
  # 安全组 (Security Groups)
  # ==========================================
  # 安全组 = 虚拟防火墙，控制进出流量

  # Lambda安全组
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda function
      VpcId: !Ref VPC
      # 出站规则（Lambda向外发送的流量）
      SecurityGroupEgress:
        # 允许访问PostgreSQL (RDS)
        - IpProtocol: tcp
          FromPort: 5432 # PostgreSQL端口
          ToPort: 5432
          Description: Allow PostgreSQL access to RDS
          CidrIp: 0.0.0.0/0 # 允许访问任何IP的5432端口
        # 允许HTTPS访问（用于访问AWS服务和外部API）
        - IpProtocol: tcp
          FromPort: 443 # HTTPS端口
          ToPort: 443
          Description: Allow HTTPS for AWS services
          CidrIp: 0.0.0.0/0 # 允许访问任何IP的443端口
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-sg

  # ==========================================
  # Lambda 函数
  # ==========================================
  # NestJS应用的Lambda函数
  NestJSFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub ${AWS::StackName}-nestjs-api
      CodeUri: ./
      Handler: dist/src/lambda.handler
      Runtime: nodejs24.x
      Timeout: 30
      MemorySize: 1024

      # VPC配置（将Lambda部署到VPC内）
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup # 使用Lambda安全组
        SubnetIds: # 部署到3个私有子网（高可用）
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
          - !Ref PrivateSubnet3

      # 环境变量
      Environment:
        Variables:
          NODE_ENV: !Ref Environment # 环境名称
          DATABASE_URL: !Sub postgres://postgres:${DBPassword}@${DBCluster.Endpoint.Address}:5432/agent_guild

      # API路由配置
      Events:
        # 捕获所有路径的请求（如/users, /posts等）
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+} # 匹配所有路径
            Method: ANY # 匹配所有HTTP方法
        # 根路径请求（/）
        RootEvent:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

  # ==========================================
  # 数据库迁移 Lambda (Migration)
  # ==========================================
  MigrationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub ${AWS::StackName}-migration
      CodeUri: .
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 300 # 5分钟超时，给迁移足够时间
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
          - !Ref PrivateSubnet3
      Environment:
        Variables:
          NODE_ENV: !Ref Environment
          DATABASE_URL: !Sub postgres://postgres:${DBPassword}@${DBCluster.Endpoint.Address}:5432/agent_guild

  # ==========================================
  # 数据库 (RDS PostgreSQL)
  # ==========================================

  # 数据库子网组
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3

  # 数据库安全组
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup # 允许Lambda访问
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-db-sg

  # 数据库集群 (Aurora Serverless v2)
  DBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      # Serverless v2 必须使用 provisioned 模式
      EngineMode: provisioned
      Port: 5432 # 强制指定 PostgreSQL 端口，避免默认为 3306
      EngineVersion: '17.4'
      DatabaseName: agent_guild
      MasterUsername: postgres
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5 # 最小 ACU (0.5 ACU ≈ 1GB Ram)
        MaxCapacity: 2.0 # 最大 ACU (根据负载自动扩展)
      StorageEncrypted: true

  # 数据库实例 (Aurora Writer, Serverless v2)
  DBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${AWS::StackName}-db-instance
      DBClusterIdentifier: !Ref DBCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false

# ==========================================
# 输出 (Outputs)
# ==========================================
# 部署完成后显示的信息
Outputs:
  # API Gateway URL
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/'

  # Lambda函数ARN
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt NestJSFunction.Arn

  # VPC ID（导出供其他栈使用）
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${AWS::StackName}-VpcId

  # Lambda安全组ID（导出供其他栈使用，如RDS可以引用）
  LambdaSecurityGroupId:
    Description: Lambda Security Group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-LambdaSG
